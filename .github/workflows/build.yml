name: Portfolio build

on:
  push:
    branches: [master, redesign/business-portfolio]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.12.0 <23'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check types
        run: npm run check
      - name: Build site
        run: npm run build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: portfolio-deploy
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '>=22.12.0 <23'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build compiled site
        working-directory: source
        run: |
          npm ci
          npm run build
      - name: Check out published branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: deploy
          path: published
      - name: Publish compiled files
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          rsync -a --delete --exclude=.git source/dist/ published/
          cd published
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Build portfolio from $SOURCE_COMMIT"
            git push origin HEAD:deploy
          fi
